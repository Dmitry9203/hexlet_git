<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Список задач</title>
<style>
    * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f5;
    color: #2d3748;
    margin: 0;
    min-height: 100vh;
    display: grid;
    grid-template-columns: 480px 1fr;
  }

  /* Левая панель */
  .sidebar {
    background: #fff;
    padding: 28px 24px;
    border-right: 1px solid #e2e8f0;
  }

  .sidebar header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .sidebar h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0;
  }

  .add-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: #4a5568;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    padding: 4px 6px;
  }
  .add-btn .plus {
    font-size: 22px;
    font-weight: 700;
    line-height: 1;
    color: #4a5568;
  }

  /*  Список задач*/
  .tasks {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  .task {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 8px;
    border-bottom: 1px solid #edf2f7;
  }

  .task input[type="checkbox"] {
    width: 20px;
    height: 20px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .task .priority {
    color: #e53e3e;
    font-size: 16px;
    flex-shrink: 0;
  }

  .task .title {
    flex: 1;
    font-size: 15px;
    word-break: break-word;
  }

  .task .actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .task .actions button {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 16px;
    color: #718096;
    padding: 2px 4px;
    font-family: inherit;
  }

  /* Выполненные */
  .task.done .title {
    text-decoration: line-through;
    color: #a0aec0;
  }

  /* Правая область */
  .workspace {
    padding: 40px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  /* Карточка задачи */
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
    padding: 28px;
    width: 100%;
    max-width: 720px;
  }

  .card h2 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 20px;
  }

  .card label {
    display: block;
    font-size: 14px;
    color: #4a5568;
    margin-bottom: 6px;
  }

  .card input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    border: 1px solid #cbd5e0;
    border-radius: 6px;
    outline: none;
    margin-bottom: 18px;
  }
  .card input[type="text"]:focus {
    border-color: #3182ce;
  }

  .card .check-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    color: #2d3748;
    margin-bottom: 24px;
    cursor: pointer;
  }
  .card .check-row input[type="checkbox"] {
    width: 20px;
    height: 20px;
    cursor: pointer;
  }
  .card .check-row .priority {
    color: #e53e3e;
  }

  .card .actions {
    display: flex;
    gap: 12px;
  }

  .btn {
    padding: 10px 28px;
    border-radius: 999px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    border: 1px solid transparent;
  }

  .btn-primary {
    background: #3182ce;
    color: #fff;
    border-color: #3182ce;
  }

  .btn-secondary {
    background: #fff;
    color: #2d3748;
    border-color: #cbd5e0;
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <header>
      <h1>Список задач</h1>
      <button class="add-btn" id="btn-add">
        <span class="plus">+</span> Добавить
      </button>
    </header>

    <ul class="tasks" id="tasks">
      <li class="task">
        <input type="checkbox">
        <span class="priority"><img src="free-icon-font-bolt-6853834.svg" alt="Высокий приоритет" width="18" height="18"></span>
        <span class="title">Задача 1</span>
        <span class="actions">
          <button title="Редактировать"><img src="free-icon-font-edit-3917361.svg" alt="Редактировать" width="18" height="18"></button>
          <button title="Удалить"><img src="free-icon-font-trash-3917242.svg" alt="Удалить" width="18" height="18"></button>
        </span>
      </li>
      <li class="task done">
        <input type="checkbox" checked>
        <span class="priority"><img src="free-icon-font-bolt-6853834.svg" alt="Высокий приоритет" width="18" height="18"></span>
        <span class="title">Задача 2</span>
        <span class="actions">
          <button title="Редактировать"><img src="free-icon-font-edit-3917361.svg" alt="Редактировать" width="18" height="18"></button>
          <button title="Удалить"><img src="free-icon-font-trash-3917242.svg" alt="Удалить" width="18" height="18"></button>
        </span>
      </li>
      <li class="task">
        <input type="checkbox">
        <span class="title">Задача 4</span>
        <span class="actions">
          <button title="Редактировать"><img src="free-icon-font-edit-3917361.svg" alt="Редактировать" width="18" height="18"></button>
          <button title="Удалить"><img src="free-icon-font-trash-3917242.svg" alt="Удалить" width="18" height="18"></button>
        </span>
      </li>
      <li class="task done">
        <input type="checkbox" checked>
        <span class="title">Задача 8</span>
        <span class="actions">
          <button title="Редактировать"><img src="free-icon-font-edit-3917361.svg" alt="Редактировать" width="18" height="18"></button>
          <button title="Удалить"><img src="free-icon-font-trash-3917242.svg" alt="Удалить" width="18" height="18"></button>
        </span>
      </li>
      <li class="task done">
        <input type="checkbox" checked>
        <span class="title">Задача 9</span>
        <span class="actions">
          <button title="Редактировать"><img src="free-icon-font-edit-3917361.svg" alt="Редактировать" width="18" height="18"></button>
          <button title="Удалить"><img src="free-icon-font-trash-3917242.svg" alt="Удалить" width="18" height="18"></button>
        </span>
      </li>
      <li class="task">
        <input type="checkbox">
        <span class="priority"><img src="free-icon-font-bolt-6853834.svg" alt="Высокий приоритет" width="18" height="18"></span>
        <span class="title">Задача 10</span>
        <span class="actions">
          <button title="Редактировать"><img src="free-icon-font-edit-3917361.svg" alt="Редактировать" width="18" height="18"></button>
          <button title="Удалить"><img src="free-icon-font-trash-3917242.svg" alt="Удалить" width="18" height="18"></button>
        </span>
      </li>
    </ul>
  </aside>

  <main class="workspace">
    <form class="card" id="task-form">
      <h2>Карточка задачи</h2>

      <label for="task-desc">Задача</label>
      <input type="text" id="task-desc" value="Описание задачи">

      <label class="check-row">
        <input type="checkbox" id="task-priority">
        Высокий приоритет <span class="priority"><img src="free-icon-font-bolt-6853834.svg" alt="Высокий приоритет" width="18" height="18"></span>
      </label>

      <div class="actions">
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <button type="button" class="btn btn-secondary" id="btn-cancel">Отменить</button>
      </div>
    </form>
  </main>

  <script>
    document.getElementById('tasks').addEventListener('change', (e) => {
      if (e.target.type !== 'checkbox') return;
      e.target.closest('.task').classList.toggle('done', e.target.checked);
    });

    document.getElementById('tasks').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const task = btn.closest('.task');

      if (btn.title === 'Удалить') {
        task.remove();
      } else if (btn.title === 'Редактировать') {
        // Заглушка: подставляем название в карточку
        document.getElementById('task-desc').value =
          task.querySelector('.title').textContent;
        document.getElementById('task-priority').checked =
          !!task.querySelector('.priority');
      }
    });

    document.getElementById('btn-add').addEventListener('click', () => {
      const li = document.createElement('li');
      li.className = 'task';
      li.innerHTML = `
        <input type="checkbox">
        <span class="title">Новая задача</span>
        <span class="actions">
          <button title="Редактировать"><img src="free-icon-font-edit-3917361.svg" alt="Редактировать" width="18" height="18"></button>
          <button title="Удалить"><img src="free-icon-font-trash-3917242.svg" alt="Удалить" width="18" height="18"></button>
        </span>`;
      document.getElementById('tasks').appendChild(li);
    });

    document.getElementById('task-form').addEventListener('submit', (e) => {
      e.preventDefault();
      console.log('Сохранено:', {
        desc: document.getElementById('task-desc').value,
        priority: document.getElementById('task-priority').checked,
      });
    });

    document.getElementById('btn-cancel').addEventListener('click', () => {
      document.getElementById('task-desc').value = '';
      document.getElementById('task-priority').checked = false;
    });
  </script>

</body>
</html>
